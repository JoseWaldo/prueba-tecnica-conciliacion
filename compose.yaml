services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./apps/backend:/app
    command: sh -c "pip install -r requirements.txt && python app.py"
    ports:
      - "5000:5000"

  frontend:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - ./apps/frontend:/app
    command: sh -c "bun install && bun run start -- --host 0.0.0.0"
    ports:
      - "4200:4200"
